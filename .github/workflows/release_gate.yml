name: TDS GA7 Release Gate

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: "TDS identity: 23f2003725@ds.study.iitm.ac.in"
        run: echo "TDS identity verified"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start API
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 &
          sleep 3

      - name: Test release gate
        run: |
          python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/docs').status)"